version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd jas-lau-dotcom
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: jas-lau-dotcom/build
    files:
      - '**/*'
  cache:
    paths:
      - jas-lau-dotcom/node_modules/**/*